name: Speed report
description: Share how fast Maya runs on your PC
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Run `./maya.sh --bench`, then `./maya.sh --report`, and attach `maya-report.txt`. It includes the benchmark.
  - type: input
    id: gpus
    attributes:
      label: GPUs, how many, and VRAM
      placeholder: Two Strix Halo gfx1151 APUs, memory per host
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU
    validations:
      required: true
  - type: input
    id: ram
    attributes:
      label: RAM
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and quant
      placeholder: GLM-5.3-Flash, Maya-S
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context length
  - type: input
    id: prompt
    attributes:
      label: Prompt length (tokens)
  - type: input
    id: prefill
    attributes:
      label: Prefill (reading the prompt), tokens/s
    validations:
      required: true
  - type: input
    id: decode
    attributes:
      label: Decode (writing the answer), tokens/s
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Maya-TP source/release version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command or config you used
      render: shell
  - type: textarea
    id: report
    attributes:
      label: maya-report.txt
      description: Drag the file here, or paste its text.
  - type: input
    id: pair_context
    attributes:
      label: Pair and request settings
      description: Host roles, RDMA device, model/quant, context, parallel slots and MTP/DSpark flags; say single-host for installer issues.
  - type: input
    id: source_build
    attributes:
      label: Source and executable identities
      description: Commit SHA and selected executable hashes/paths on both hosts, when available.
